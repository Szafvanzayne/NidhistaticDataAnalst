<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Nidhika Loomba</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --tangerine: #F27249;
      --wisteria: #BEACDF;
      --saffron: #EDC470;
      --ink: #1F2430;
      --muted: #606775;
      --cream: #FFF9F3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 15%, rgba(190,172,223,.20), transparent 30%),
        linear-gradient(135deg, #fffaf7, #fffdfb 60%, #fbf9fd);
    }

    .card {
      width: min(640px, 100%);
      padding: 48px;
      background: white;
      border: 1px solid rgba(31,36,48,.10);
      box-shadow: 0 18px 50px rgba(31,36,48,.08);
      text-align: center;
    }

    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      background: var(--tangerine);
      color: white;
      font: 800 28px "Manrope", sans-serif;
    }

    h1 {
      margin: 0;
      font: 800 clamp(32px, 6vw, 48px)/1.1 "Manrope", sans-serif;
      letter-spacing: -0.03em;
    }

    p {
      margin: 18px auto 0;
      max-width: 500px;
      color: var(--muted);
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      margin-top: 28px;
      min-height: 50px;
      padding: 0 24px;
      align-items: center;
      justify-content: center;
      color: var(--tangerine);
      border: 1.5px solid var(--tangerine);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: rgba(242,114,73,.06);
    }

    @media (max-width: 560px) {
      .card { padding: 34px 22px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">NL</div>
    <h1>Thank you for reaching out.</h1>
    <p>Your inquiry has been received. I appreciate you taking the time to share a little about what you are looking for, and I’ll be in touch soon.</p>
    <a href="https://www.nidhikaloomba.com/">Back to website</a>
  </main>
</body>
</html>
